[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthoct-bibimbap"
version = "0.1.0"
description = "Mac-first SynthOCT challenge baselines for digital phantom generation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "matplotlib>=3.8",
  "requests>=2.32",
  "scikit-image>=0.23",
  "sewar>=0.4.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]
lpips = ["lpips>=0.1.4", "torch==2.10.0"]

[project.scripts]
synthoct = "synthoct.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
