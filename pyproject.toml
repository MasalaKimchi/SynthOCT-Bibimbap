[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synthoct-bibimbap"
version = "0.1.0"
description = "Coherent holographic inversion for scanner-compatible SynthOCT phantoms."
readme = "README.md"
authors = [{ name = "Justin Namuk Kim" }]
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "numba>=0.60",
  "matplotlib>=3.9",
  "requests>=2.32",
  "scikit-image>=0.23",
  "sewar>=0.4.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]
lpips = ["lpips>=0.1.4", "torch>=2.6", "torchvision>=0.21"]

[project.urls]
Repository = "https://github.com/MasalaKimchi/SynthOCT-Bibimbap"
Challenge = "https://synthoct.com/"

[project.scripts]
synthoct = "synthoct.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
